apiVersion: workspace.jupyter.org/v1alpha1
kind: Workspace
metadata:
  name: workspace-with-emptydir
spec:
  displayName: "Workspace with emptyDir Volume"
  desiredStatus: Running
  image: jk8s-application-jupyter-uv:latest
  storage:
    size: 1Gi
  volumes:
    - name: shm
      mountPath: /dev/shm
      emptyDir:
        medium: Memory
        sizeLimit: 1Gi
